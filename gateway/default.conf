server {
    listen 8080;
    server_name _;

    location = /health { return 200 'gateway ok'; }
    location ~ ^/equipment(?:/|$) { proxy_pass http://catalog:8080; }
    location ~ ^/loans(?:/|$) { proxy_pass http://loans:8080; }
    location ~ ^/reports(?:/|$) { proxy_pass http://reports:8080; }
    location / { return 404; }
}
