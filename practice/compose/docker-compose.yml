services:
  api:
    build: ../../services/catalog
    ports:
      - "127.0.0.1:${PORT:-8080}:8080"
    environment:
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Database: "Host=db;Database=app;Username=postgres;Password=${POSTGRES_PASSWORD:-1234}"
      Logging__LogLevel__Microsoft.AspNetCore.HttpLogging: Information
    depends_on:
      db:
        condition: service_healthy
    networks: [app]
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: app
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-1234}
    volumes:
      - db_data:/var/lib/postgresql/data
      - ../../database/01-schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -h 127.0.0.1 -U postgres -d app']
      interval: 3s
      timeout: 3s
      retries: 20
    networks: [app]

networks:
  app:

volumes:
  db_data:
